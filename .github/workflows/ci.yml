name: UiPath CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-analyze:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - use-cases/01-invoice-processing
          - use-cases/02-web-scraping
          - use-cases/03-email-automation
          - use-cases/04-api-integration

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Installer UiPath CLI
        run: |
          nuget install UiPath.CLI.Windows -Version 24.10.0 -OutputDirectory .uipcli -Source https://www.myget.org/F/uipath-dev/api/v3/index.json
        shell: pwsh

      - name: Restaurer les dependances du projet (${{ matrix.module }})
        run: |
          $uipcli = Get-ChildItem -Path .uipcli -Recurse -Filter uipcli.exe | Select-Object -First 1
          & $uipcli.FullName package restore "${{ matrix.module }}/src/project.json"
        shell: pwsh

      - name: Analyse statique (Workflow Analyzer)
        run: |
          $uipcli = Get-ChildItem -Path .uipcli -Recurse -Filter uipcli.exe | Select-Object -First 1
          & $uipcli.FullName package analyze "${{ matrix.module }}/src/project.json" --treatWarningsAsErrors false
        shell: pwsh

      - name: Packager le projet (.nupkg)
        run: |
          $uipcli = Get-ChildItem -Path .uipcli -Recurse -Filter uipcli.exe | Select-Object -First 1
          & $uipcli.FullName package pack "${{ matrix.module }}/src/project.json" -o ./output
        shell: pwsh

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.module }}
          path: ./output/*.nupkg
