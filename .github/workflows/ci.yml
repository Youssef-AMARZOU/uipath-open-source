name: UiPath CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-analyze:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - use-cases/01-invoice-processing
          - use-cases/02-web-scraping
          - use-cases/03-email-automation
          - use-cases/04-api-integration

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Installer UiPath CLI
        run: dotnet tool install --global UiPath.CLI.Windows --version 25.10.21
        shell: pwsh

      - name: Verifier installation
        run: uipcli --version
        shell: pwsh

      - name: Restaurer les dependances du projet (${{ matrix.module }})
        run: uipcli package restore "${{ matrix.module }}/src/project.json"
        shell: pwsh

      - name: Analyse statique (Workflow Analyzer)
        run: uipcli package analyze "${{ matrix.module }}/src/project.json" --treatWarningsAsErrors false
        shell: pwsh

      - name: Packager le projet (.nupkg)
        run: uipcli package pack "${{ matrix.module }}/src/project.json" -o ./output
        shell: pwsh

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.module }}
          path: ./output/*.nupkg
