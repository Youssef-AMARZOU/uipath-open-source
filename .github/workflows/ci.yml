name: UiPath CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-analyze:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - use-cases/01-invoice-processing
          - use-cases/02-web-scraping
          - use-cases/03-email-automation
          - use-cases/04-api-integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install UiPath CLI
        run: dotnet tool install --global UiPath.CLI.Windows

      - name: Verify
        run: uipcli --version

      - name: Restore
        run: uipcli package restore "${{ matrix.module }}/src/project.json"
        continue-on-error: true

      - name: Analyze
        run: uipcli package analyze "${{ matrix.module }}/src/project.json"
        continue-on-error: true

      - name: Pack
        run: uipcli package pack "${{ matrix.module }}/src/project.json" -o ./output
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-${{ matrix.module }}
          path: ./output/*.nupkg
          if-no-files-found: ignore
